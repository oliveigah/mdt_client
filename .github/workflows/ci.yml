name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3"
          elixir-version: "1.19.4"
          version-type: strict

      - name: Install dependencies
        run: mix deps.get

      - name: Run project checks and tests
        run: mix precommit
