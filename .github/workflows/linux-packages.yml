name: Linux packages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }} package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debian
            script: ./scripts/build-deb.sh
            artifact: MDT-deb-amd64
            path: dist/MDT_*.deb
          - label: Fedora
            script: ./scripts/build-rpm.sh
            artifact: MDT-rpm-x86_64
            path: dist/MDT-*.rpm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build ${{ matrix.label }} package
        run: ${{ matrix.script }}

      - name: Record package checksum
        run: sha256sum ${{ matrix.path }}

      - name: Upload ${{ matrix.label }} package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
