name: Release Linux packages

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }} package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debian
            script: ./scripts/build-deb.sh
            artifact: MDT-deb-amd64
            path: dist/MDT_*.deb
          - label: Fedora
            script: ./scripts/build-rpm.sh
            artifact: MDT-rpm-x86_64
            path: dist/MDT-*.rpm

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build ${{ matrix.label }} package
        run: ${{ matrix.script }}

      - name: Record package checksum
        run: sha256sum ${{ matrix.path }}

      - name: Store ${{ matrix.label }} package for publishing
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Attach packages to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: MDT-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum -- ./*.deb ./*.rpm | tee SHA256SUMS

      - name: Upload packages to GitHub Release
        run: >-
          gh release upload "$RELEASE_TAG"
          release-assets/*.deb
          release-assets/*.rpm
          release-assets/SHA256SUMS
          --clobber
          --repo "$GITHUB_REPOSITORY"
