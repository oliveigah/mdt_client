name: Release Linux packages

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }} package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debian
            script: ./scripts/build-deb.sh
            extension: deb
          - label: Fedora
            script: ./scripts/build-rpm.sh
            extension: rpm

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PACKAGE_EXTENSION: ${{ matrix.extension }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set package version from release tag
        run: |
          package_version="$(python3 scripts/set-release-version.py "$RELEASE_TAG")"
          printf 'PACKAGE_VERSION=%s\n' "$package_version" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.label }} package
        run: ${{ matrix.script }}

      - name: Name package for release
        run: |
          shopt -s nullglob
          packages=(dist/*."$PACKAGE_EXTENSION")
          if (( ${#packages[@]} != 1 )); then
            printf 'Expected one .%s package, found %s\n' "$PACKAGE_EXTENSION" "${#packages[@]}" >&2
            exit 1
          fi
          target="dist/MDT_${PACKAGE_VERSION}.${PACKAGE_EXTENSION}"
          if [[ "${packages[0]}" != "$target" ]]; then
            mv -- "${packages[0]}" "$target"
          fi

      - name: Record package checksum
        run: sha256sum "dist/MDT_${PACKAGE_VERSION}.${PACKAGE_EXTENSION}"

      - name: Store ${{ matrix.label }} package for publishing
        uses: actions/upload-artifact@v7
        with:
          name: MDT_${{ env.PACKAGE_VERSION }}.${{ matrix.extension }}
          path: dist/MDT_${{ env.PACKAGE_VERSION }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Attach packages to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: MDT_*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum -- ./*.deb ./*.rpm | tee SHA256SUMS

      - name: Upload packages to GitHub Release
        run: >-
          gh release upload "$RELEASE_TAG"
          release-assets/*.deb
          release-assets/*.rpm
          release-assets/SHA256SUMS
          --clobber
          --repo "$GITHUB_REPOSITORY"
