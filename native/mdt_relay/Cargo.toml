[package]
name = "mdt-relay"
version = "0.1.0"
edition = "2021"
description = "The first process in the bubble MDT runs microsandbox in"
publish = false

# No dependencies: the build needs no network, and there is less to trust.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
